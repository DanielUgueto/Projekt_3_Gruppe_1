<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rediger bil</title>
</head>
<body>

<main>
    <section>
        <form th:action="@{/dashboard/car/edit}" method="post">
            <div>
                <div>
                    <label for="brandName">Mærke</label>
                    <input type="text" id="brandName" name="brandName" list="brands" th:value="${carBrand.brandName}">
                    <datalist id="brands">
                        <option th:each="brand : ${brands}"
                                th:value="${brand.brandName}"></option>
                    </datalist>
                    <p th:if="${error != null}" th:text="${error}" style="color:red"></p>
                </div>
                <div>
                    <label for="modelName">Model</label>
                    <input type="text" id="modelName" name="modelName" th:value="${carModel.modelName}">
                </div>
                <div>
                    <label for="equipmentLevel">Udstyrsniveau</label>
                    <input type="text" id="equipmentLevel" name="equipmentLevel" th:value="${carModel.equipmentLevel}">
                </div>
                <div>
                    <label for="fuelType">Brændstof</label>
                    <select id="fuelType" name="fuelType">
                        <option value="Petrol" th:selected="${carModel.fuelType == 'Petrol'}">Petrol</option>
                        <option value="Diesel" th:selected="${carModel.fuelType == 'Diesel'}">Diesel</option>
                        <option value="Hybrid" th:selected="${carModel.fuelType == 'Hybrid'}">Hybrid</option>
                        <option value="Electric" th:selected="${carModel.fuelType == 'Electric'}">Electric</option>
                    </select>
                </div>
                <div>
                    <label for="shiftGearType">Gear type</label>
                    <select id="shiftGearType" name="shiftGearType">
                        <option value="Manual" th:selected="${carModel.shiftGearType == 'Manual'}">Manual</option>
                        <option value="Automatic" th:selected="${carModel.shiftGearType == 'Automatic'}">Automatic</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label for="vinNumber">Stelnummer</label>
                    <input type="text" id="vinNumber" name="vinNumber" th:value="${car.vinNumber}">
                </div>
                <div>
                    <label for="licensePlate">Nummerplade</label>
                    <input type="text" id="licensePlate" name="licensePlate" th:value="${car.licensePlate}">
                </div>
                <div>
                    <label for="monthlyPrice">Månedlig pris</label>
                    <input type="number" id="monthlyPrice" name="monthlyPrice" th:value="${car.monthlyPrice}" step="0.01">
                </div>
                <div>
                    <label for="registrationDate">Registreringsdato</label>
                    <input type="text" id="registrationDate" name="registrationDate" th:value="${car.registrationDate}">
                </div>
                <div>
                    <label for="colour">Farve</label>
                    <input type="text" id="colour" name="colour" th:value="${car.colour}">
                </div>
                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Ledig" th:selected="${car.status == 'Ledig'}">Ledig</option>
                        <option value="Udlejet" th:selected="${car.status == 'Udlejet'}">Udlejet</option>
                        <option value="Tilbageleveret" th:selected="${car.status == 'Tilbageleveret'}">Tilbageleveret</option>
                        <option value="Klar til transport" th:selected="${car.status == 'Klar til transport'}">Klar til transport</option>
                        <option value="Udgået" th:selected="${car.status == 'Udgået'}">Udgået</option>
                    </select>
                </div>
            </div>
            <input type="hidden" name="carId" th:value="${car.carId}">
            <input type="hidden" name="carBrandId" th:value="${carBrand.carBrandId}">
            <input type="hidden" name="carModelId" th:value="${carModel.carModelId}">
            <button type="submit">Gem ændringer</button>
        </form>
    </section>
</main>

</body>
</html>
