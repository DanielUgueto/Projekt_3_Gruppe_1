<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" th:href="@{/img/transport.svg}" type="image/svg">
    <title>login</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/login-style.css}">
</head>
<body>

<main class="login-page">
    <section class="login-panel">
        <header>
            <h1>Login side</h1>
            <p>Log ind for at få adgang til biludlejningssystemet.</p>
        </header>

        <form th:action="@{/login}" method="post">
            <div>
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" placeholder="Skriv din e-mail" value="demo1">
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Skriv dit password" value="demo">
            </div>

            <button type="submit">Login</button>
        </form>

        <p th:if="${error}" th:text="${error}" style="color:red"></p>
    </section>
</main>

</body>
</html>
