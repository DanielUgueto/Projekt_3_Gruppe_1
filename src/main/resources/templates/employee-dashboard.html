<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <link rel="icon" th:href="@{/img/transport.svg}" type="image/svg">
    <title>Medarbejder overblik</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/dashboard-style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="dashboard-split">
    <div class="dashboard-split-car">
        <section class="dashboard-car-filter">
            <div>
                <form th:action="@{/employee/dashboard}" method="get">
                    <label for="status">Filtrer efter medarbejder status:</label>
                    <select name="status" id="status">
                        <option value="">Alle</option>
                        <option value="aktiv" th:selected="${status == 'aktiv'}">Aktiv</option>
                        <option value="inaktiv" th:selected="${status == 'inaktiv'}">Inaktiv</option>
                    </select>
                    <button type="submit">Filtrer</button>
                    <div>
                        <p th:if="${error != null}" th:text="${error}" style="color:red"></p>
                        <p th:if="${success != null}" th:text="${success}" style="color:green"></p>
                    </div>
                </form>
            </div>
        </section>

        <div class="dashboard-car-box">
            <article class="dashboard-car-info" th:each="employee : ${employeeList}">
                <a th:href="@{/employee/dashboard(employeeId=${employee.employeeId}, status=${status})}">
                    <div>
                        <h4>
                            <span th:text="${employee.firstName}"></span>
                            <span th:text="${employee.lastName}"></span>
                        </h4>
                    </div>
                    <div>
                        <span th:text="${employee.role}"></span>
                    </div>
                    <div>
                        <span th:text="${employee.email}"></span>
                    </div>
                </a>
            </article>
        </div>
    </div>

    <div class="dashboard-split-single-car">
        <article class="selected-car-panel" th:if="${selectedEmployee != null}">
            <header class="selected-car-header">
                <h2>
                    <span th:text="${selectedEmployee.firstName}"></span>
                    <span th:text="${selectedEmployee.lastName}"></span>
                </h2>
                <strong><p th:text="${selectedEmployee.role}"></p></strong>
            </header>

            <section class="selected-car-section">
                <h3>Medarbejder oplysninger</h3>
                <p><strong>Fornavn:</strong> <span th:text="${selectedEmployee.firstName}"></span></p>
                <p><strong>Efternavn:</strong> <span th:text="${selectedEmployee.lastName}"></span></p>
                <p><strong>Work-email:</strong> <span th:text="${selectedEmployee.email}"></span></p>
                <p><strong>Status:</strong> <span th:text="${selectedEmployee.isActive}"></span></p>
            </section>

            <section class="selected-car-section"
                     th:if="${employee.role.equalsIgnoreCase('dataregistrering')}">

                <form
                        th:if="${selectedEmployee.isActive}"
                        th:action="@{/employee/delete}"
                        onsubmit="return confirm('Er du sikker på du vil sætte denne medarbejder som inaktiv?');"
                        method="post">
                    <input type="hidden" name="employeeId" th:value="${selectedEmployee.employeeId}">
                    <input type="hidden" name="status" th:value="${status}">
                    <p th:if="${error != null}" style="color: red;" th:text="${error}"></p>
                    <button class="delete-btn" type="submit">Sæt medarbejder som inaktiv</button>
                </form>

                <form
                        th:if="${!selectedEmployee.isActive}"
                        th:action="@{/employee/reactivate}"
                        onsubmit="return confirm('Er du sikker på du vil genaktivere denne medarbejder?');"
                        method="post">
                    <input type="hidden" name="employeeId" th:value="${selectedEmployee.employeeId}">
                    <input type="hidden" name="status" th:value="${status}">
                    <p th:if="${reactivationError != null}" style="color: red;" th:text="${reactivationError}"></p>
                    <button class="delete-btn" type="submit">Genaktiver medarbejder</button>
                </form>

            </section>

        </article>

        <article class="selected-car-placeholder" th:if="${selectedEmployee == null}">
            <h2>Ingen medarbejder valgt</h2>
            <p>Vælg en medarbejder i oversigten til venstre for at se detaljer her.</p>
            <p th:if="${notFound != null}" th:text="${notFound}" style="color: red"></p>
        </article>

    </div>
</div>
</body>
</html>
