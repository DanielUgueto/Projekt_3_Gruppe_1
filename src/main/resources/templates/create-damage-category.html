<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" th:href="@{/img/carfavicon.png}" type="image/png">
    <title>Opret skadekategori</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/add-employee-style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h1>Opret skadekategori</h1>

<section class="create-employee-box">
    <form th:action="@{/damage-categories/create}" method="post">
        <p th:if="${error}" th:text="${error}" class="error-message" style="color:red"></p>

        <div class="create-customer-field">
            <section class="create-customer-box-section">
                <h3>Kategori info:</h3>
                <div class="input-field">
                    <label for="name">Navn:</label>
                    <input type="text" name="name" id="name"
                           th:value="${name}" placeholder="Fx Knust rude" required>
                </div>
                <div class="input-field">
                    <label for="standardPrice">Standardpris (kr.):</label>
                    <input type="number" step="0.01" min="0.01" name="standardPrice" id="standardPrice"
                           th:value="${standardPrice}" placeholder="Fx 1500" required>
                </div>
                <div class="input-field">
                    <label for="description">Beskrivelse:</label>
                    <input type="text" name="description" id="description"
                           th:value="${description}" placeholder="Kort beskrivelse">
                </div>
            </section>
        </div>

        <button type="submit">Opret kategori</button>
    </form>
</section>

</body>
</html>
