<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Opret Skadesrapport</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/create-damageReport-style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<p th:if="${fejl}" th:text="${fejl}" style="color: red;"></p>

<div class="damage-report-box">
    <div class="damage-report-form">
        <h1>Opret Skadesrapport</h1>

        <section>
            <form th:action="@{/damage-reports/add-damage/{id}(id=${rentalContract.rentalContractId})}" method="post">
                <label for="damageCategoryId">Skadekategori:</label>
                <select id="damageCategoryId" name="damageCategoryId" required>
                    <option value="">-- Vælg kategori --</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.damageCategoryId}"
                            th:text="${category.name} + ' — ' + ${category.standardPrice} + ' kr.'">
                    </option>
                </select>
                <button type="submit">Tilføj skade</button>
            </form>
        </section>

        <section>
            <h2>Valgte skader</h2>
            <p th:if="${#lists.isEmpty(selectedDamages)}">Ingen skader tilføjet endnu.</p>
            <p th:each="damage : ${selectedDamages}" th:text="${damage.name} + ' — ' + ${damage.standardPrice} + ' kr.'"></p>
            <p>Samlet pris:<span th:text="${totalPrice}"></span> kr.</p>
        </section>

        <section>
            <form th:action="@{/damage-reports/create/{id}(id=${rentalContract.rentalContractId})}" method="post">
                <input type="hidden" name="employeeId" th:value="${employeeId}">
                <label for="description">Beskrivelse:</label>
                <input type="text" id="description" name="description" required>
                <button type="submit">Opret skadesrapport</button>
            </form>
        </section>

    </div>
</div>

</body>
</html>
