<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Opret Bil</title>
</head>
<body>
<h1>Opret Bil</h1>

<p th:if="${fejl}" th:text="${fejl}" style="color: red;"></p>

<section>
    <form action="@{/cars/create}" method="post">
    
    <label for="carModelId">Bilmodel:</label>
    <select id="carModelId" name="carModelId" required>
        <option value="">-- Vælg model --</option>
        <option th:each="carModel : ${carModels}"
                th:value="${carModel.carModelId}"
                th:text="${carModel.modelName + ' - ' + carModel.equipmentLevel}">
        </option>
    </select>

    <label for="vinNumber">Stelnummer:</label>
    <input type="text" id="vinNumber" name="vinNumber" required>

    <label for="licensePlate">Nummerplade:</label>
    <input type="text" id="licensePlate" name="licensePlate" required>

    <label for="colour">Farve:</label>
    <input type="text" id="colour" name="colour" required>

    <input type="hidden" name="status" value="Ledig">

    <label for="monthlyPrice">Månedlig pris:</label>
    <input type="number" id="monthlyPrice" name="monthlyPrice" step="0.01" required>

    <button type="submit">Opret bil</button>
</form>
</section>

</body>
</html>
