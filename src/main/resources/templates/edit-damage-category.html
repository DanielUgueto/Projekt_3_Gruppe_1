<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rediger skadekategori</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/add-employee-style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h1>Rediger skadekategori</h1>

<section class="create-employee-box">
    <form th:action="@{/damage-categories/edit}" method="post">
        <input type="hidden" name="damageCategoryId"
               th:value="${selectedDamageCategory.damageCategoryId}">

        <p th:if="${error}" th:text="${error}" style="color:red"></p>

        <div class="create-customer-field">
            <section class="create-customer-box-section">
                <h3>Kategori info:</h3>
                <div class="input-field">
                    <label for="name">Navn:</label>
                    <input type="text" name="name" id="name" placeholder="Navn"
                           th:value="${selectedDamageCategory.name}" required>
                </div>
                <div class="input-field">
                    <label for="standardPrice">Standardpris (kr.):</label>
                    <input type="number" step="0.01" min="0.01" name="standardPrice" id="standardPrice"
                           placeholder="Standardpris"
                           th:value="${selectedDamageCategory.standardPrice}" required>
                </div>
                <div class="input-field">
                    <label for="description">Beskrivelse:</label>
                    <input type="text" name="description" id="description"
                           placeholder="Beskrivelse"
                           th:value="${selectedDamageCategory.description}">
                </div>
            </section>
        </div>

        <button type="submit">Gem ændringer</button>
    </form>
</section>

</body>
</html>
