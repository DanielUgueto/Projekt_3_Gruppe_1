<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Opret kunde</title>
    <link rel="stylesheet" th:href="@{/style.css}">

</head>
<body>

<h1>Opret kunde</h1>

<form th:action="@{/customer/register}" method="post">

    <input type="text" name="firstName" placeholder="Fornavn" required>
    <input type="text" name="lastName" placeholder="Efternavn" required>
    <input type="text" name="driversLicenseNumber" placeholder="Kørekort" required>
    <input type="text" name="cprNumber" placeholder="CPR-nummer" required>
    <input type="email" name="email" placeholder="Email adresse" required>
    <input type="text" name="phoneNumber" placeholder="Telefon nummer" required>

    <button type="submit">Opret kunde</button>

</form>


</body>
</html>
