# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - BilabonnementGruppe1Projekt3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: bilabonnement
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Load DDL and DML into test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ptestpassword bilabonnement < src/main/resources/DatabaseScript.sql
          mysql -h 127.0.0.1 -P 3306 -u root -ptestpassword bilabonnement < src/main/resources/DummyData.sql

      - name: Run tests
        env:
          JDBC_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/bilabonnement
          JDBC_USERNAME: root
          JDBC_PASSWORD: testpassword
        run: mvn test

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B6588F090F8B416EBED80FFCC4404258 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_93F68BFB57B541D692BC580109D2C371 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BFCF6A9783F744849D42A0B6D9EAA25F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'BilabonnementGruppe1Projekt3'
          slot-name: 'Production'
          package: '*.jar'